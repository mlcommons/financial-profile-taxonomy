# MLCommons Agent Reliability Profile: Artifact Vocabulary
# Version: 0.1.0
# Date: 2026-10-29
# Source: "Agent Reliability Profiles in Financial Services" (preprint,
#         September 2026), Sections 3, 5, and 6.
#
# taxonomy.yaml defines the option universe for the four axes. This file
# defines the vocabulary of the artifact that records one deployment's values
# on those axes: its sections, provenance types, assurance levels, the
# benchmark comparability flag, and the change-control vocabulary.
#
# It is NOT a Profile instance schema. Conformance schemas and reference tools
# are the remit of the Profile Kit.

taxonomy_version: "0.1.0"

profile_tuple:
  notation: "P(D) = { S(D), E, F, V, I }"
  components:
    S(D): "Scope tuple (T, O, A+, A-, C); see taxonomy.yaml"
    E: "Evidence record with its provenance map"
    F: "Set of floors with their status"
    V: >
      Validity function: a validity window together with the specified
      criteria or triggers that would deprecate the Profile's trust status
    I: "Issuer, subject, method, schema version, and signatures"
  note: >
    A Profile is a structured claim with evidence and conditions, not a
    scalar score.

sections:
  - id: identity-and-issuance
    name: Identity and issuance
    required_content: >
      Profile identifier; deployment identity; name of accountable owner; name
      of issuer; issue time; validity interval; schema and versions;
      signatures of the owner and issuer; parent Platform Baseline Profile and
      version, where applicable.
    purpose: "Binds the claim to a deployment, owner, issuer, and method."
  - id: claim-boundaries
    name: Claim boundaries
    required_content: >
      Autonomy tier; operational design domain; permitted and prohibited
      action-class sets; control envelope.
    purpose: "States the assessed scope."
  - id: assurance-statement
    name: Assurance statement
    required_content: >
      Production assurance level (Level 1, 2, or 3) for each axis and the
      headline level; benchmark comparability flag, with its
      environment-fidelity statement where set; assessor role; test
      environment.
    purpose: "Identifies the basis and independence of the evidence."
  - id: floors
    name: Floors
    required_content: "Required pass-or-fail conditions; status; finding references."
    purpose: "Prevents aggregate performance from masking critical failure."
  - id: results
    name: Results
    required_content: >
      Evaluator-level results at assurance level 2 or 3; benchmark result
      where the benchmark comparability flag is set.
    purpose: "Reports supported findings without implying additional assurance."
  - id: provenance-map
    name: Provenance map
    required_content: >
      Field-level source type: measured, configuration-derived,
      document-derived, owner-attested, or absent.
    purpose: "Makes evidence quality visible."
  - id: out-of-scope-statement
    name: Out-of-scope statement
    required_content: "Domains, actions, controls, and users / adopters excluded from the claim."
    purpose: "Defines the external boundary of the claim."
  - id: invalidation-list
    name: Invalidation list
    required_content: "Changes that void the Profile, or might require partial retesting."
    purpose: "Supports change-sensitive validity."
  - id: evidence-pointers
    name: Evidence pointers
    required_content: >
      Content hashes and stable identifiers for inputs, evaluator outputs and
      action traces, and assessor reports.
    purpose: "Connects the summary to the Profile Package."
  - id: status-and-limitations
    name: Status and limitations
    required_content: "Open findings, exceptions, risk acceptances, and interpretation limits."
    purpose: "Preserves decision context."

provenance_types:
  - {id: measured, name: Measured}
  - {id: configuration-derived, name: Configuration-derived, description: "Checked against deployed configuration"}
  - {id: document-derived, name: Document-derived, description: "Extracted from a signed institutional document"}
  - {id: owner-attested, name: Owner-attested, description: "Attested by a named owner"}
  - {id: absent, name: Absent}
provenance_rule: >
  Conflicts are made visible. If a policy specifies read-only access but the
  deployed credential holds write permissions, the Level 1 Profile records the
  conflict, while the Level 2 Profile tests the effective boundary.

floor_definition: >
  A pass-or-fail condition that cannot be offset by good results elsewhere.
  Floors are evaluated before any graded result is computed, and are set
  before runs. A failed safety floor blocks issuance of a Profile even when
  average task performance is high.

assurance_levels:
  ordering: "Level 1 < Level 2 < Level 3 (totally ordered)"
  levels:
    - id: L1
      name: Asserted Profile
      level: 1
      tool: Profile Builder
      what_happens: "The institution's own documents and settings are read and compiled into a Profile."
      who_stands_behind_it: The institution
      where_it_runs: Nothing is executed
      what_the_profile_says: Self-reported
      minimum_bar: "Inputs attested by a named owner"
      may_claim: "This is what we believe we have deployed"
      may_not_claim: "Nothing tested"
      data_leaves_institution: "No"
    - id: L2
      name: Validated Profile
      level: 2
      tool: Profile Validator
      what_happens: "The institution runs tests against its own agent."
      who_stands_behind_it: The institution
      where_it_runs: "The institution's own environment"
      what_the_profile_says: "Self-reported, self-tested"
      minimum_bar: "Reproducible generation, a content hash, signed inputs"
      may_claim: "No critical control failure under the conditions we tested"
      may_not_claim: "No independence"
      data_leaves_institution: "No"
    - id: L3
      name: Verified Profile
      level: 3
      tool: "Profile Validator, operated and signed by a qualified independent assessor"
      what_happens: "A qualified independent assessor runs the tests."
      who_stands_behind_it: An independent assurance firm
      where_it_runs: "The institution's own environment"
      what_the_profile_says: "Self-reported, independently tested"
      minimum_bar: "The Level 2 bar, plus a qualified independent assessor and its own signed report"
      may_claim: "The same, tested by someone other than us"
      may_not_claim: "No comparability with any other system"
      data_leaves_institution: "Either the evidence travels or the assessor works on site"

benchmark_comparability_flag:
  id: benchmarked
  name: Benchmarked Profile
  is_assurance_level: false
  tool: Profile Benchmarker
  what_happens: "An independent assessor runs the agent in a shared environment."
  who_stands_behind_it: An independent assessor
  where_it_runs: "A shared reference environment with a hidden, rotating scenario set"
  what_the_profile_says: "In addition to its production assurance level: independently benchmarked"
  minimum_bar: "Accredited assessor, named environment version, named hidden-set version"
  may_claim: "A result comparable with other institutions under the reference conditions"
  may_not_claim: "No additional assurance about production behavior"
  data_leaves_institution: "Sometimes, depending on the benchmarking infrastructure and the benchmarked components"
  note: >
    A separate field, not an assurance level. It trades production fidelity
    for cross-institution comparability and does not raise the Profile's
    production assurance level.

assurance_vector:
  notation: "L(P) = (L_T, L_O, L_A, L_C)"
  headline_rule: "L_headline(P) = min{L_T, L_O, L_A, L_C}"
  rationale: >
    Prevents strong evidence on one axis from raising the apparent assurance
    of a weaker axis, while the full vector remains visible. The benchmark
    comparability flag does not enter the minimum.
  asymmetry: >
    The autonomy axis is the one on which the institution's own operational
    evidence remains indispensable even at the highest assurance levels,
    because distinguishing substantive from reflexive approval requires the
    approval logs of the actual deployment.

terminology:
  assess: "What an institution does to an agent."
  compile: "What an institution does to produce its Profile."
  issue: "What a named owner does; the owner signs the Profile."
  validate: "Level 2 evidence-generating operation."
  verify: "Level 3; what a qualified independent assessor does."
  benchmark: "Evidence-generating operation that sets the comparability flag."
  examine: "What a supervisor does to any Profile."

validity:
  window: "A specified period, or until material change, whichever is sooner."
  invalidation_triggers:
    - id: odd-expansion
      name: Expansion to a new ODD
    - id: higher-consequence-action-class
      name: Addition of a higher-consequence action class
    - id: critical-control-removed
      name: Removal of a critical control
    - id: new-access
      name: New access, such as a revised owner
    - id: topology-change
      name: Changed multi-agent topology with new delegation paths
    - id: model-or-harness-change
      name: Model or harness change that can alter tested behavior
    - id: platform-substrate-change
      name: Material change to the platform substrate (voids the Platform Baseline Profile and every anchored Profile)
  change_classes:
    - {id: void, name: "Voids the Profile"}
    - {id: partial-retest, name: "Requires partial retesting"}
    - {id: no-effect, name: "No effect on the claim (cosmetic)"}

profile_package:
  description: >
    The Profile plus the signed inputs, evidence, and trace it was compiled
    from. The Profile is the light, scannable summary; the Package is its full
    backing.
  contents:
    - Signed source manifest and inputs
    - Deployment bill of materials and environment manifest
    - Tool catalog, permission map, and control configuration
    - Domain specification and scenario manifest
    - Evaluator definitions, versions, and thresholds
    - Immutable execution trace
    - Floor findings and evaluator outputs
    - Replay material (where disclosure is safe)
    - Independent assessor's report
    - Benchmark environment and hidden-set version identifiers
    - Cryptographic hashes and signatures connecting each component
