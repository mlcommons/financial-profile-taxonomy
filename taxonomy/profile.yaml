# MLCommons Agent Reliability Profile Taxonomy: pointer to the Profile specification
# Version: 0.1.0
#
# This repository defines the vocabulary of the four axes (taxonomy.yaml).
# It does NOT define the Profile artifact. The sections a Profile must contain,
# evidence (provenance) classes, floors, assurance levels and the benchmark
# comparability flag, invalidation triggers, and the Profile Package are
# specified normatively by the Agent Reliability Profile Specification in the
# Profile Kit. Where any page in this repository describes those things, it is
# an explanatory summary and the specification governs.
#
# Kept as a pointer so that tools reading this path find where the Profile is
# defined, rather than a second, competing definition.

taxonomy_version: "0.1.0"

profile_specification:
  name: Agent Reliability Profile Specification
  identifier: arp/1.0-rc2
  maintained_in: "Agent Reliability Profile Kit, spec/SPEC.md"
  governance: >
    Normative. Changes require MLCommons Financial Services Working Group
    approval, as for this taxonomy.
  conceptual_source: >
    Hsu et al., "Agent Reliability Profiles in Financial Services" (preprint,
    2026), Sections 3, 5 and 6.

vocabulary_ownership:
  taxonomy:  # this repository; exported to vocab/ by scripts/export_vocab.py
    - autonomy-tiers   # tiers T0-T4, status U, and the six modifiers
    - business-lines
    - use-cases
    - action-classes
    - control-catalogue
  specification:  # the Profile Kit, spec/vocab/
    - provenance-classes
    - invalidation-triggers
    - dispositions
    - conflict-kinds
    - peer-control-set
    - peer-control-status
